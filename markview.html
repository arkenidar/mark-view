* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--fg);
  background: var(--bg);
  line-height: 1.6;
}
header {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: .75rem;
  padding: .5rem .75rem;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.brand { font-weight: 700; white-space: nowrap; }
#navbar { display: flex; gap: .4rem; flex: 1; min-width: 0; }
#path-input {
  flex: 1; min-width: 0; padding: .4rem .6rem;
  font: inherit; color: var(--fg);
  border: 1px solid var(--border); border-radius: 6px;
}
#path-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(9,105,218,.2); }
#navbar button {
  padding: .4rem .9rem; font: inherit; cursor: pointer; white-space: nowrap;
  color: var(--fg); background: #f6f8fa;
  border: 1px solid var(--border); border-radius: 6px;
}
#navbar button:hover { background: #eef1f4; }
main { max-width: 780px; margin: 0 auto; padding: 2rem 1.5rem 4rem; overflow-wrap: break-word; }
.status { color: var(--muted); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
main h1, main h2, main h3, main h4 { line-height: 1.25; margin: 1.5em 0 .5em; scroll-margin-top: 4.5rem; }
main h1 { padding-bottom: .3em; border-bottom: 1px solid var(--border); }
main p, main ul, main ol { margin: 0 0 1em; }
main code, main pre {
  font-family: "markview-mono", ui-monospace, "Cascadia Mono", "SF Mono", SFMono-Regular, Menlo, Consolas,
               "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono", "Roboto Mono", monospace;
}
main code {
  background: var(--code-bg); padding: .15em .35em; border-radius: 6px; font-size: .92em;
}
main pre { background: var(--code-bg); padding: 1rem; border-radius: 6px; overflow-x: auto; }
main pre code { background: none; padding: 0; font-size: .9em; line-height: 1.3; }
main img { max-width: 100%; }
main blockquote { margin: 0 0 1em; padding: 0 1em; color: var(--muted); border-left: 4px solid var(--border); }
main hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
main table { border-collapse: collapse; margin: 0 0 1em; display: block; overflow-x: auto; max-width: 100%; }
main th, main td { border: 1px solid var(--border); padding: .4rem .8rem; }
@media (max-width: 420px) {
  header { gap: .5rem; padding: .45rem .5rem; }
  .brand { font-size: .95em; }
  #navbar { gap: .3rem; }
  #navbar button { padding: .4rem .6rem; }
}
</style>
</head>

    <button type="submit">Go</button>
  </form>
</header>
<main id="content"></main>

(function () {
  'use strict';

  var DEFAULT_FILES = ['index.md', 'README.md'];

  var pathInput = document.getElementById('path-input');
  var navbar = document.getElementById('navbar');
  var currentFile = null;
  var scrollPositions = {};

  function dirname(p) {
    var i = p.lastIndexOf('/');
    return i === -1 ? '' : p.slice(0, i);
  }

  }

    } else {
      if (currentFile) scrollPositions[currentFile] = window.scrollY;

  }
